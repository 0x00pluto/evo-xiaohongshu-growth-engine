<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>小红书增长引擎</title>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/iconify-icon@2/dist/iconify-icon.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@lottiefiles/lottie-player@2.0.12/dist/lottie-player.js"></script>
  <script src="shell.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
  <style>
    /* Cal 色板只覆盖语义变量，圆角和控件尺寸仍跟 daisyUI。子页注入本页，不必再写一份。 */
    [data-theme="light"] {
      color-scheme: light;
      --color-base-100: #ffffff;
      --color-base-200: #f5f5f5;
      --color-base-300: #e5e7eb;
      --color-base-content: #111111;
      --color-primary: #111111;
      --color-primary-content: #ffffff;
      --color-accent: #3b82f6;
      --color-accent-content: #ffffff;
      --color-success: #10b981;
      --color-success-content: #ffffff;
      --color-warning: #f59e0b;
      --color-warning-content: #111111;
      --color-error: #ef4444;
      --color-error-content: #ffffff;
    }
    :focus-visible {
      outline: 2px solid currentColor;
      outline-offset: 2px;
    }
    [x-cloak] { display: none !important; }
    .wrap {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .prompt-editor {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    .prompt-color-run {
      white-space: nowrap;
    }
    .prompt-color-swatch {
      display: inline-block;
      width: 0.75rem;
      height: 0.75rem;
      margin: 0 0.15rem;
      vertical-align: -0.1rem;
      border: 1px solid rgba(17, 17, 17, 0.3);
      border-radius: 2px;
      padding: 0;
      cursor: pointer;
    }
    .prompt-color-swatch:disabled {
      cursor: default;
      opacity: 0.7;
    }
    .prompt-editor:focus {
      outline: none;
      border-color: rgba(17, 17, 17, 0.4);
    }
    /* 资料库学图册：文案从左到右显现 → 轻脉冲前进 → 快消，单句 3.5s */
    .learn-line {
      display: inline-block;
      max-width: 100%;
      will-change: clip-path, opacity, transform;
      animation: learn-line-cycle 3.5s ease-in-out forwards;
    }
    @keyframes learn-line-cycle {
      0% {
        clip-path: inset(0 100% 0 0);
        opacity: 1;
        transform: translateX(0);
      }
      13% {
        clip-path: inset(0 0 0 0);
        opacity: 1;
        transform: translateX(0);
      }
      28% {
        opacity: 1;
        transform: translateX(0.15rem);
      }
      42% {
        opacity: 0.72;
        transform: translateX(0.28rem);
      }
      56% {
        opacity: 1;
        transform: translateX(0.4rem);
      }
      78% {
        clip-path: inset(0 0 0 0);
        opacity: 1;
        transform: translateX(0.55rem);
      }
      100% {
        clip-path: inset(0 0 0 0);
        opacity: 0;
        transform: translateX(0.7rem);
      }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
      .learn-line {
        animation: none !important;
        clip-path: none;
        opacity: 1;
        transform: none;
      }
    }
  </style>
</head>
<body class="min-h-screen bg-base-100 text-base-content" x-data="shell()" x-cloak>
  <div class="drawer lg:drawer-open">
    <input id="studio-drawer" class="drawer-toggle" type="checkbox" x-ref="drawer" />
    <div class="drawer-content flex h-dvh min-h-0 flex-col overflow-hidden">
      <div class="flex items-center border-b border-base-300 px-4 py-3 lg:hidden">
        <label class="btn btn-ghost btn-sm" for="studio-drawer">菜单</label>
      </div>
      <div id="host-banner" class="alert mx-4 mt-4" role="status" x-show="!hostReady">
        <span>请在 Dex Buddy 工作台中打开，或在本机运行操作台。离开这两种入口时，生成按钮不可用。</span>
      </div>
      <p id="page-error" class="px-4 pt-4 text-sm text-error" role="alert" x-show="pageError" x-text="pageError"></p>
      <div id="workspace" class="flex min-h-0 min-w-0 flex-1 flex-col" x-ref="workspace"></div>
    </div>
    <div class="drawer-side z-20">
      <label class="drawer-overlay" for="studio-drawer" aria-label="关闭菜单"></label>
      <aside
        class="flex min-h-full flex-col gap-6 border-r border-base-300 bg-base-100 p-4 transition-[width] duration-200"
        :class="navCollapsed ? 'w-64 lg:w-[4.5rem]' : 'w-64'"
      >
        <div class="flex items-center gap-1" :class="navCollapsed ? 'lg:justify-center' : 'justify-between'">
          <p class="px-2 text-sm font-medium" :class="navCollapsed ? 'lg:hidden' : ''">小红书增长引擎</p>
          <button
            class="btn btn-ghost btn-sm btn-square hidden shrink-0 lg:inline-flex"
            type="button"
            :aria-label="navCollapsed ? '展开侧边栏' : '收起侧边栏'"
            :aria-expanded="!navCollapsed"
            @click="toggleNav()"
          >
            <iconify-icon
              :icon="navCollapsed ? 'lucide:panel-left-open' : 'lucide:panel-left-close'"
              width="18"
              height="18"
              aria-hidden="true"
            ></iconify-icon>
          </button>
        </div>
        <ul class="menu w-full gap-1 p-0">
          <template x-for="item in visibleMenu" :key="item.id">
            <li>
              <button
                type="button"
                :id="'nav-' + item.id"
                :class="[
                  page === item.id ? 'menu-active' : '',
                  navCollapsed ? 'lg:justify-center lg:tooltip lg:tooltip-right' : '',
                ]"
                :data-tip="navCollapsed ? item.label : undefined"
                :aria-label="item.label"
                :aria-current="page === item.id ? 'page' : false"
                @click="open(item)"
              >
                <iconify-icon :icon="item.icon" width="18" height="18" class="shrink-0" aria-hidden="true"></iconify-icon>
                <span :class="navCollapsed ? 'lg:hidden' : ''" x-text="item.label"></span>
              </button>
            </li>
          </template>
        </ul>
      </aside>
    </div>
  </div>
</body>
</html>
