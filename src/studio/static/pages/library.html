<div
  class="flex min-h-0 min-w-0 flex-1 flex-col"
  x-data="libraryPage()"
  x-init="init()"
  @library-open-create.window="openCreateMenu()"
  @library-albums-busy.window="onAlbumsBusy($event.detail)"
>
  <div class="flex shrink-0 flex-col gap-2 border-b border-base-300 px-4 py-2.5 lg:px-6">
    <div class="flex items-center justify-between gap-3">
      <h1 class="text-base font-medium">资料库</h1>
      <div class="relative" @click.outside="closeCreate()" @keydown.escape.window="closeCreate()">
        <button
          id="album-add"
          class="btn btn-neutral btn-sm gap-1"
          type="button"
          aria-haspopup="menu"
          :aria-expanded="createOpen ? 'true' : 'false'"
          @click="toggleCreate()"
          :disabled="!hostReady || albumsBusy"
        >
          <span>新建</span>
          <svg class="h-3.5 w-3.5 opacity-70" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
            <path fill-rule="evenodd" d="M5.23 7.21a.75.75 0 011.06.02L10 11.17l3.71-3.94a.75.75 0 111.08 1.04l-4.25 4.5a.75.75 0 01-1.08 0l-4.25-4.5a.75.75 0 01.02-1.06z" clip-rule="evenodd" />
          </svg>
        </button>
        <div
          class="absolute right-0 z-40 mt-1.5 w-44 overflow-hidden rounded-lg border border-base-300 bg-base-100 py-1 shadow-lg"
          x-show="createOpen"
          x-cloak
          role="menu"
          aria-label="创建新内容"
        >
          <p class="px-3 py-1.5 text-xs text-base-content/50">创建新内容</p>
          <button
            class="flex w-full items-center px-3 py-2 text-left text-sm hover:bg-base-200"
            type="button"
            role="menuitem"
            @click="onCreateAlbums()"
          >图库</button>
          <button
            class="flex w-full items-center px-3 py-2 text-left text-sm hover:bg-base-200"
            type="button"
            role="menuitem"
            @click="onCreateUploadRefs()"
          >上传参考</button>
        </div>
      </div>
    </div>
    <div class="flex flex-wrap gap-2" role="tablist" aria-label="资源类型">
      <template x-for="tab in tabs" :key="tab.id">
        <button
          class="rounded-full px-3 py-1 text-sm"
          type="button"
          role="tab"
          :id="'library-tab-' + tab.id"
          :aria-selected="activeTab === tab.id ? 'true' : 'false'"
          :class="activeTab === tab.id ? 'bg-base-200 font-medium text-base-content' : 'text-base-content/60'"
          @click="selectTab(tab.id)"
          x-text="tab.label"
        ></button>
      </template>
    </div>
  </div>

  <div
    class="flex min-h-0 min-w-0 flex-1 flex-col"
    x-show="activeTab === 'albums'"
    x-data="libraryAlbums()"
    x-init="init()"
    role="tabpanel"
    aria-labelledby="library-tab-albums"
    @library-pick-image.window="onPickImage()"
  >
    <input
      class="hidden"
      type="file"
      accept="image/jpeg,image/png,image/webp,.jpg,.jpeg,.png,.webp"
      x-ref="fileInput"
      @change="onFileChange($event)"
    />

    <div class="min-h-0 flex-1 overflow-y-auto px-4 py-3 lg:px-6">
      <p class="mb-3 text-sm text-error" role="alert" x-show="error" x-text="error"></p>
      <p class="mb-3 text-sm text-base-content/60" role="status" x-show="notice && !error" x-text="notice"></p>
      <p class="mb-3 text-sm text-base-content/60" x-show="learning">正在学习参考图，请稍等…</p>

      <div class="flex flex-col gap-4" x-show="!albums.length && !learning">
        <div class="rounded-lg bg-base-200 p-4">
          <p class="text-sm leading-6">还没有图册。交一张参考图，系统会学成一本风格草稿，确认后再写入柜子。</p>
          <div class="mt-3">
            <button
              class="btn btn-neutral btn-sm"
              type="button"
              @click="$dispatch('library-open-create')"
              :disabled="!hostReady || learning || committing"
            >新建</button>
          </div>
        </div>
      </div>

      <div class="grid grid-cols-3 gap-2 sm:grid-cols-6" role="list" aria-label="图册" x-show="albums.length">
        <template x-for="album in albums" :key="album.id">
          <div class="flex flex-col gap-1" role="listitem">
            <button
              class="relative aspect-[3/4] w-full overflow-hidden rounded-lg bg-base-200 text-left"
              type="button"
              :aria-label="album.label"
              :disabled="learning || committing"
              @click="openDetail(album)"
            >
              <img class="absolute inset-0 h-full w-full object-cover" x-show="albumSamplePreview(album)" :src="albumSamplePreview(album)" alt="" />
              <span class="absolute inset-0 flex items-center justify-center text-[10px] text-base-content/40" x-show="!albumSamplePreview(album)">无样图</span>
              <span class="pointer-events-none absolute inset-x-0 bottom-0 bg-gradient-to-t from-black/70 to-transparent px-1.5 pb-1.5 pt-6">
                <span class="line-clamp-2 text-xs leading-4 text-white" x-text="album.label"></span>
              </span>
            </button>
            <template x-if="album.deletable">
              <button
                class="btn btn-ghost btn-xs self-start"
                type="button"
                @click="askDelete(album)"
                :disabled="learning || committing || deleting"
              >删除</button>
            </template>
          </div>
        </template>
      </div>
    </div>

    <div
      id="library-detail-modal"
      class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 p-4"
      x-show="detailOpen"
      x-cloak
      role="dialog"
      aria-modal="true"
      aria-labelledby="library-detail-title"
      @keydown.escape.window="!eyedropper.open && !unsavedOpen && detailOpen && closeDetail()"
    >
      <button class="absolute inset-0 cursor-default" type="button" aria-label="关闭" @click="closeDetail()"></button>
      <div class="relative z-10 grid h-[calc(100dvh-2rem)] w-full max-w-3xl min-h-0 grid-cols-1 grid-rows-[12rem_minmax(0,1fr)] items-stretch overflow-hidden rounded-lg border border-base-300 bg-base-100 shadow-lg sm:grid-cols-2 sm:grid-rows-1" @click.stop>
        <div class="flex min-h-0 w-full items-center justify-center overflow-hidden bg-base-200 p-4">
          <img class="max-h-full max-w-full object-contain" x-show="detailSample" :src="detailSample" alt="" />
          <span class="text-sm text-base-content/40" x-show="!detailSample">无样图</span>
        </div>
        <div class="flex min-h-0 flex-col gap-3 overflow-hidden p-4">
          <div class="flex shrink-0 items-start justify-between gap-3">
            <h3 id="library-detail-title" class="min-w-0 text-base font-medium" x-text="detail && detail.label"></h3>
            <button class="btn btn-ghost btn-square btn-sm shrink-0" type="button" aria-label="关闭" @click="closeDetail()">×</button>
          </div>
          <p class="shrink-0 text-sm leading-6 text-base-content/70" x-text="detail && detail.hint"></p>
          <div class="flex min-h-0 flex-1 flex-col gap-2 overflow-hidden">
            <div class="flex shrink-0 items-center justify-between gap-2">
              <div class="min-w-0">
                <p class="text-sm font-medium">图册提示词</p>
                <p
                  class="mt-0.5 text-xs text-base-content/50"
                  x-show="detail && detail.promptSheetVersion"
                  x-text="'题词结构 v' + (detail && detail.promptSheetVersion)"
                ></p>
              </div>
              <button
                class="btn btn-primary btn-xs"
                type="button"
                x-show="detailEditable()"
                @click="saveDetailPrompt()"
                :disabled="savingDetail || !detailDirty()"
              >保存</button>
            </div>
            <div
              class="prompt-editor min-h-0 flex-1 overflow-auto rounded-md border border-base-300 bg-base-100 p-3 text-xs leading-5"
              x-ref="detailPromptEditor"
              role="textbox"
              aria-multiline="true"
              aria-label="图册提示词"
              :contenteditable="detailEditable() ? 'true' : 'false'"
              @input="onPromptEditorInput('detail')"
              @blur="onPromptEditorBlur('detail')"
              @click="onPromptEditorClick($event, 'detail')"
            ></div>
          </div>
        </div>
      </div>
    </div>

    <div
      id="library-draft-modal"
      class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 p-4"
      x-show="draftOpen"
      x-cloak
      role="dialog"
      aria-modal="true"
      aria-labelledby="library-draft-title"
      @keydown.escape.window="!eyedropper.open && draftOpen && onDiscardDraft()"
    >
      <button class="absolute inset-0 cursor-default" type="button" aria-label="关闭" @click="onDiscardDraft()"></button>
      <div class="relative z-10 grid h-[calc(100dvh-2rem)] w-full max-w-3xl min-h-0 grid-cols-1 grid-rows-[12rem_minmax(0,1fr)] items-stretch overflow-hidden rounded-lg border border-base-300 bg-base-100 shadow-lg sm:grid-cols-2 sm:grid-rows-1" @click.stop>
        <div class="flex min-h-0 w-full items-center justify-center overflow-hidden bg-base-200 p-4">
          <img class="max-h-full max-w-full object-contain" x-show="draft && draft.sampleDataUrl" :src="draft && draft.sampleDataUrl" alt="" />
        </div>
        <div class="flex min-h-0 flex-col gap-3 overflow-hidden p-4">
          <div class="flex shrink-0 items-start justify-between gap-3">
            <div class="min-w-0">
              <p class="text-xs text-base-content/50">学习草稿（未写入）</p>
              <h3 id="library-draft-title" class="text-base font-medium" x-text="draft && draft.label"></h3>
              <p class="mt-1 text-xs text-base-content/50" x-text="draft && draft.id"></p>
            </div>
          </div>
          <p class="shrink-0 text-sm leading-6 text-base-content/70" x-text="draft && draft.hint"></p>
          <div class="flex min-h-0 flex-1 flex-col gap-2 overflow-hidden">
            <p class="shrink-0 text-sm font-medium">图册提示词</p>
            <div
              class="prompt-editor min-h-0 flex-1 overflow-auto rounded-md border border-base-300 bg-base-100 p-3 text-xs leading-5"
              x-ref="draftPromptEditor"
              role="textbox"
              aria-multiline="true"
              aria-label="图册提示词"
              contenteditable="true"
              @input="onPromptEditorInput('draft')"
              @blur="onPromptEditorBlur('draft')"
              @click="onPromptEditorClick($event, 'draft')"
            ></div>
          </div>
          <div class="flex shrink-0 justify-end gap-2">
            <button class="btn btn-ghost btn-sm" type="button" @click="onDiscardDraft()" :disabled="committing">放弃</button>
            <button class="btn btn-primary btn-sm" type="button" @click="onCommitDraft()" :disabled="committing">确定写入</button>
          </div>
        </div>
      </div>
    </div>

    <div
      id="library-eyedropper"
      class="fixed inset-0 z-[60] flex flex-col bg-black/80"
      x-show="eyedropper.open"
      x-cloak
      role="dialog"
      aria-modal="true"
      aria-label="从样图吸色"
      @keydown.escape.window="eyedropper.open && closeEyedropper()"
    >
      <div class="flex shrink-0 items-center justify-between gap-3 px-4 py-3 text-white">
        <p class="text-sm">十字中心为取样点。单击取色，Esc 取消。</p>
        <div class="flex items-center gap-2">
          <span
            class="inline-block h-5 w-5 rounded border border-white/50"
            x-show="eyedropper.previewHex"
            :style="'background:' + eyedropper.previewHex"
          ></span>
          <span class="font-mono text-xs" x-text="eyedropper.previewHex || ''"></span>
          <button class="btn btn-ghost btn-sm text-white" type="button" @click="closeEyedropper()">取消</button>
        </div>
      </div>
      <div
        class="relative min-h-0 flex-1 cursor-none overflow-hidden p-4"
        @mousemove="onEyedropperMove($event)"
        @click="onEyedropperPick($event)"
      >
        <img
          class="mx-auto max-h-full max-w-full object-contain select-none"
          x-ref="eyedropperImage"
          :src="eyedropper.imageUrl"
          alt=""
          draggable="false"
          @load="onEyedropperImageLoad()"
        />
        <div
          class="pointer-events-none absolute z-10"
          x-show="eyedropper.loupeVisible"
          :style="'left:' + eyedropper.loupeX + 'px;top:' + eyedropper.loupeY + 'px;'"
        >
          <canvas
            class="block -translate-x-1/2 -translate-y-1/2 rounded-full shadow-lg"
            x-ref="eyedropperLoupe"
            width="112"
            height="112"
          ></canvas>
        </div>
      </div>
    </div>

    <div
      id="library-unsaved-modal"
      class="fixed inset-0 z-[70] flex items-center justify-center bg-black/40 p-4"
      x-show="unsavedOpen"
      x-cloak
      role="dialog"
      aria-modal="true"
      aria-labelledby="library-unsaved-title"
      @keydown.escape.window="unsavedOpen && cancelUnsavedClose()"
    >
      <button class="absolute inset-0 cursor-default" type="button" aria-label="取消" @click="cancelUnsavedClose()"></button>
      <div class="relative z-10 w-full max-w-sm rounded-lg border border-base-300 bg-base-100 p-4 shadow-lg" @click.stop>
        <h3 id="library-unsaved-title" class="text-base font-medium">题词已改但还没保存，确定关闭？</h3>
        <p class="mt-2 text-sm leading-6 text-base-content/70">关闭后未保存的修改会丢失。</p>
        <div class="mt-4 flex justify-end gap-2">
          <button class="btn btn-ghost btn-sm" type="button" @click="cancelUnsavedClose()">取消</button>
          <button class="btn btn-neutral btn-sm" type="button" @click="confirmUnsavedClose()">仍要关闭</button>
        </div>
      </div>
    </div>

    <div
      id="library-delete-modal"
      class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 p-4"
      x-show="deleteOpen"
      x-cloak
      role="dialog"
      aria-modal="true"
      aria-labelledby="library-delete-title"
      @keydown.escape.window="cancelDelete()"
    >
      <button class="absolute inset-0 cursor-default" type="button" aria-label="取消" @click="cancelDelete()"></button>
      <div class="relative z-10 w-full max-w-sm rounded-lg border border-base-300 bg-base-100 p-4 shadow-lg" @click.stop>
        <h3 id="library-delete-title" class="text-base font-medium">删除这本图册？</h3>
        <p class="mt-2 text-sm leading-6 text-base-content/70">
          将删除「<span x-text="deleteTarget && deleteTarget.label"></span>」。不可撤销。
        </p>
        <div class="mt-4 flex justify-end gap-2">
          <button class="btn btn-ghost btn-sm" type="button" @click="cancelDelete()" :disabled="deleting">取消</button>
          <button class="btn btn-error btn-sm" type="button" @click="confirmDelete()" :disabled="deleting">删除这本</button>
        </div>
      </div>
    </div>
  </div>

  <div
    class="flex min-h-0 min-w-0 flex-1 flex-col"
    x-show="activeTab === 'upload-refs'"
    x-data="libraryUploadRefs()"
    x-init="init()"
    role="tabpanel"
    aria-labelledby="library-tab-upload-refs"
    @library-pick-upload-ref.window="onPickUploadRef()"
  >
    <input
      class="hidden"
      type="file"
      accept="image/jpeg,image/png,image/webp,.jpg,.jpeg,.png,.webp"
      x-ref="uploadRefFileInput"
      @change="onUploadRefFileChange($event)"
    />

    <div class="min-h-0 flex-1 overflow-y-auto px-4 py-3 lg:px-6">
      <p class="mb-3 text-sm text-error" role="alert" x-show="error" x-text="error"></p>
      <p class="mb-3 text-sm text-base-content/60" role="status" x-show="notice && !error" x-text="notice"></p>

      <div class="flex flex-col gap-4" x-show="!uploadRefs.length">
        <div class="rounded-lg bg-base-200 p-4">
          <p class="text-sm leading-6">还没有上传参考图。用右上「新建 → 上传参考」准备资料；也可以在「这篇笔记」上传后，点方块「笔」里的「存进库」。</p>
          <div class="mt-3">
            <button
              class="btn btn-neutral btn-sm"
              type="button"
              @click="$dispatch('library-open-create')"
              :disabled="!hostReady || uploadBusy || deleting"
            >新建</button>
          </div>
        </div>
      </div>

      <div class="grid grid-cols-3 gap-2 sm:grid-cols-6" role="list" aria-label="上传参考" x-show="uploadRefs.length">
        <template x-for="item in uploadRefs" :key="item.id">
          <button
            class="relative aspect-square w-full overflow-hidden rounded-md bg-base-200 text-left active:scale-95"
            type="button"
            role="listitem"
            :aria-label="'上传参考，' + (item.usage || '点击查看用法')"
            @click="openDetail(item)"
          >
            <img class="absolute inset-0 h-full w-full object-cover" x-show="uploadRefPreview(item)" :src="uploadRefPreview(item)" alt="" />
            <span class="absolute inset-0 flex items-center justify-center text-[10px] text-base-content/40" x-show="!uploadRefPreview(item)">无预览</span>
          </button>
        </template>
      </div>
    </div>

    <div
      id="library-upload-ref-create-modal"
      class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 p-4"
      x-show="uploadOpen"
      x-cloak
      role="dialog"
      aria-modal="true"
      aria-labelledby="library-upload-ref-create-title"
      @keydown.escape.window="uploadOpen && closeUpload()"
    >
      <button class="absolute inset-0 cursor-default" type="button" aria-label="取消" @click="closeUpload()"></button>
      <div class="relative z-10 flex w-full max-w-md flex-col gap-3 rounded-lg border border-base-300 bg-base-100 p-4 shadow-lg" @click.stop>
        <h3 id="library-upload-ref-create-title" class="text-base font-medium">写上用法句</h3>
        <div class="flex aspect-[3/4] max-h-48 items-center justify-center overflow-hidden rounded-md bg-base-200">
          <img class="max-h-full max-w-full object-contain" x-show="uploadPending" :src="uploadPending" alt="" />
        </div>
        <label class="text-sm" for="library-upload-ref-usage-input">用法句（必填）</label>
        <textarea
          id="library-upload-ref-usage-input"
          class="textarea min-h-20 w-full"
          x-model="uploadUsage"
          :placeholder="usagePlaceholder"
          :disabled="uploadBusy"
        ></textarea>
        <p class="text-sm text-error" role="alert" x-show="uploadError" x-text="uploadError"></p>
        <div class="flex flex-wrap justify-between gap-2">
          <button class="btn btn-ghost btn-sm" type="button" @click="draftUploadUsage()" :disabled="uploadBusy || !uploadPending">识图起草</button>
          <div class="flex gap-2">
            <button class="btn btn-ghost btn-sm" type="button" @click="closeUpload()" :disabled="uploadBusy">放弃</button>
            <button class="btn btn-primary btn-sm" type="button" @click="confirmUpload()" :disabled="uploadBusy || !String(uploadUsage || '').trim()">确认入库</button>
          </div>
        </div>
      </div>
    </div>

    <div
      id="library-upload-ref-detail-modal"
      class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 p-4"
      x-show="detailOpen"
      x-cloak
      role="dialog"
      aria-modal="true"
      aria-labelledby="library-upload-ref-detail-title"
      @keydown.escape.window="!deleteOpen && !uploadOpen && detailOpen && closeDetail()"
    >
      <button class="absolute inset-0 cursor-default" type="button" aria-label="关闭" @click="closeDetail()"></button>
      <div class="relative z-10 grid max-h-[calc(100dvh-2rem)] w-full max-w-3xl grid-cols-1 overflow-hidden rounded-lg border border-base-300 bg-base-100 shadow-lg md:grid-cols-2" @click.stop>
        <div class="flex min-h-0 items-center justify-center bg-base-200 p-4">
          <img class="max-h-[min(28rem,60dvh)] max-w-full object-contain" x-show="detailPreview" :src="detailPreview" alt="" />
          <span class="text-sm text-base-content/40" x-show="!detailPreview">无预览</span>
        </div>
        <div class="flex min-h-0 flex-col gap-3 overflow-auto p-4">
          <div class="flex items-start justify-between gap-2">
            <h3 id="library-upload-ref-detail-title" class="text-base font-medium">上传参考</h3>
            <button class="btn btn-ghost btn-square btn-sm shrink-0" type="button" aria-label="关闭" @click="closeDetail()">×</button>
          </div>
          <div class="flex flex-col gap-1">
            <p class="text-sm font-medium">用法句</p>
            <p class="whitespace-pre-wrap break-words text-sm leading-6 text-base-content/80" x-text="detailTarget && detailTarget.usage"></p>
          </div>
          <div class="mt-auto flex justify-end gap-2 pt-2">
            <button class="btn btn-error btn-sm" type="button" @click="askDeleteFromDetail()" :disabled="deleting">删除</button>
          </div>
        </div>
      </div>
    </div>

    <div
      id="library-upload-ref-delete-modal"
      class="fixed inset-0 z-[60] flex items-center justify-center bg-black/40 p-4"
      x-show="deleteOpen"
      x-cloak
      role="dialog"
      aria-modal="true"
      aria-labelledby="library-upload-ref-delete-title"
      @keydown.escape.window="cancelDelete()"
    >
      <button class="absolute inset-0 cursor-default" type="button" aria-label="取消" @click="cancelDelete()"></button>
      <div class="relative z-10 w-full max-w-sm rounded-lg border border-base-300 bg-base-100 p-4 shadow-lg" @click.stop>
        <h3 id="library-upload-ref-delete-title" class="text-base font-medium">删除这条上传参考？</h3>
        <p class="mt-2 text-sm leading-6 text-base-content/70">
          将从资料库删掉「<span class="break-words" x-text="deleteTarget && deleteTarget.usage"></span>」。不可撤销。已拷进某篇笔记的副本不受影响。
        </p>
        <div class="mt-4 flex justify-end gap-2">
          <button class="btn btn-ghost btn-sm" type="button" @click="cancelDelete()" :disabled="deleting">取消</button>
          <button class="btn btn-error btn-sm" type="button" @click="confirmDelete()" :disabled="deleting">删除</button>
        </div>
      </div>
    </div>
  </div>
</div>
