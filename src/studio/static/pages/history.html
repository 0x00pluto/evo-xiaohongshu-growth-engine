<div class="flex min-h-0 flex-1 flex-col" x-data="historyPage()" x-init="init()">
  <template x-if="toast">
    <div class="toast toast-top toast-center z-[70]">
      <div class="alert bg-base-100 text-base-content shadow" role="status">
        <span x-text="toast"></span>
      </div>
    </div>
  </template>
  <header class="shrink-0 border-b border-base-300">
    <div class="flex items-center justify-between gap-3 px-4 py-3 lg:px-6">
      <h1 class="text-xl font-medium">以前的笔记</h1>
      <button id="write-new" class="btn btn-primary btn-sm" type="button" @click="onWriteNew()">写新的一篇</button>
    </div>
    <p
      id="history-notice"
      class="px-4 pb-3 text-sm text-error lg:px-6"
      role="alert"
      x-show="notice"
      x-text="notice"
    ></p>
  </header>

  <div class="min-h-0 flex-1 overflow-y-auto px-4 py-4 lg:px-6">
    <p id="history-empty" class="text-sm leading-6" x-show="posts.length === 0">还没有写过。</p>
    <div
      class="grid grid-cols-3 gap-2 sm:grid-cols-4 md:grid-cols-6 xl:grid-cols-8"
      role="list"
      aria-label="以前的笔记"
      x-show="posts.length"
    >
      <template x-for="item in posts" :key="item.id">
        <div class="group relative flex flex-col gap-1.5" role="listitem">
          <div class="relative">
            <button
              class="relative aspect-[3/4] w-full overflow-hidden rounded-lg bg-base-200 text-left transition-shadow hover:shadow-md"
              type="button"
              :aria-label="item.title || '未命名'"
              @click="openDetail(item)"
            >
              <img
                class="absolute inset-0 h-full w-full object-cover"
                x-show="coverPreview(item)"
                :src="coverPreview(item)"
                alt=""
              />
              <div
                class="absolute inset-0 overflow-hidden p-1.5"
                x-show="!coverPreview(item)"
              >
                <p
                  class="h-full overflow-hidden whitespace-pre-wrap break-words text-[10px] leading-[14px] text-base-content/70"
                  x-text="item.postText || '（无正文）'"
                ></p>
              </div>
            </button>
            <button
              class="btn btn-ghost btn-xs btn-square absolute bottom-1.5 right-1.5 z-10 bg-base-100/90 opacity-0 shadow-sm transition-opacity group-hover:opacity-100 group-focus-within:opacity-100"
              type="button"
              aria-label="复制"
              :disabled="!item.postText"
              @click="onCopy(item)"
            >
              <iconify-icon icon="lucide:copy" width="14" height="14" aria-hidden="true"></iconify-icon>
            </button>
          </div>
          <div class="min-w-0 px-0.5">
            <p class="line-clamp-2 text-xs font-medium leading-4" x-text="item.title || '未命名'"></p>
            <p class="mt-0.5 text-xs text-base-content/60" x-text="when(item.createdAt)"></p>
          </div>
        </div>
      </template>
    </div>
  </div>

  <div
    id="history-detail-modal"
    class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 p-4"
    x-show="detailOpen"
    x-cloak
    role="dialog"
    aria-modal="true"
    aria-labelledby="history-detail-title"
    @keydown.escape.window="detailOpen && closeDetail()"
    @keydown.window="onDetailKeydown($event)"
  >
    <button class="absolute inset-0 cursor-default" type="button" aria-label="关闭" @click="closeDetail()"></button>
    <div
      class="relative z-10 grid h-[calc(100dvh-2rem)] w-full max-w-5xl min-h-0 grid-cols-1 grid-rows-[minmax(12rem,45%)_minmax(0,1fr)] items-stretch overflow-hidden rounded-lg border border-base-300 bg-base-100 shadow-lg sm:grid-cols-2 sm:grid-rows-1"
      @click.stop
      @wheel.stop
    >
      <div class="group/media relative flex min-h-0 w-full items-center justify-center overflow-hidden bg-base-200">
        <p class="text-sm text-base-content/50" x-show="detailLoading">正在打开…</p>
        <img
          class="max-h-full max-w-full object-contain"
          x-show="!detailLoading && currentSlide()"
          :src="currentSlide() ? currentSlide().dataUrl : ''"
          alt=""
        />
        <p
          class="text-sm text-base-content/40"
          x-show="!detailLoading && !currentSlide()"
        >还没有图</p>

        <button
          class="btn btn-circle btn-sm absolute left-2 top-1/2 z-10 -translate-y-1/2 bg-base-100/90 opacity-0 shadow transition-opacity group-hover/media:opacity-100 focus:opacity-100"
          type="button"
          aria-label="上一张"
          x-show="detailImageCount() > 1"
          @click="prevSlide()"
        >
          <iconify-icon icon="lucide:chevron-left" width="18" height="18" aria-hidden="true"></iconify-icon>
        </button>
        <button
          class="btn btn-circle btn-sm absolute right-2 top-1/2 z-10 -translate-y-1/2 bg-base-100/90 opacity-0 shadow transition-opacity group-hover/media:opacity-100 focus:opacity-100"
          type="button"
          aria-label="下一张"
          x-show="detailImageCount() > 1"
          @click="nextSlide()"
        >
          <iconify-icon icon="lucide:chevron-right" width="18" height="18" aria-hidden="true"></iconify-icon>
        </button>

        <p
          class="pointer-events-none absolute right-3 top-3 rounded-md bg-black/55 px-2 py-0.5 text-xs text-white"
          x-show="detailImageCount() > 1"
          x-text="(slideIndex + 1) + '/' + detailImageCount()"
        ></p>
        <div
          class="absolute bottom-3 left-0 right-0 flex justify-center gap-1.5"
          x-show="detailImageCount() > 1"
        >
          <template x-for="(img, index) in (detail && detail.images) || []" :key="img.key">
            <button
              class="h-1.5 w-1.5 rounded-full"
              type="button"
              :class="index === slideIndex ? 'bg-base-content' : 'bg-base-content/30'"
              :aria-label="'第 ' + (index + 1) + ' 张'"
              :aria-current="index === slideIndex ? 'true' : 'false'"
              @click="goSlide(index)"
            ></button>
          </template>
        </div>
      </div>

      <div class="flex min-h-0 flex-col gap-3 overflow-hidden p-4">
        <div class="flex shrink-0 justify-end">
          <button
            class="btn btn-ghost btn-square btn-sm shrink-0"
            type="button"
            aria-label="关闭"
            @click="closeDetail()"
          >
            <iconify-icon icon="lucide:x" width="16" height="16" aria-hidden="true"></iconify-icon>
          </button>
        </div>

        <div class="min-w-0 shrink-0">
          <h3
            id="history-detail-title"
            class="text-base font-medium leading-6"
            x-text="(detail && detail.title) || '未命名'"
          ></h3>
          <p
            class="mt-1 text-xs text-base-content/60"
            x-show="detail && detail.createdAt"
            x-text="when(detail && detail.createdAt)"
          ></p>
        </div>

        <div class="min-h-0 flex-1 overflow-y-auto overscroll-contain">
          <p
            class="wrap text-sm leading-6"
            x-show="detailBodyText()"
            x-text="detailBodyText()"
          ></p>
          <p class="text-sm text-base-content/40" x-show="!detailLoading && !detailBodyText()">还没有正文</p>
        </div>

        <div class="flex shrink-0 justify-end gap-2 border-t border-base-300 pt-3">
          <button
            class="btn btn-ghost btn-sm"
            type="button"
            :disabled="!detail || !detail.postText"
            @click="onCopyDetail()"
          >复制</button>
          <button
            class="btn btn-primary btn-sm"
            type="button"
            :disabled="!detail || !detail.id"
            @click="onEdit()"
          >编辑</button>
        </div>
      </div>
    </div>
  </div>
</div>
